<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Reveal + Horizontal Projects</title>

<style>
/* ===== BASIC RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Inter", sans-serif;
  overflow-x: hidden;
  scroll-behavior: smooth;
}

/* ============================
   HERO SECTION — Peek through
============================ */
.hero {
  height: 100vh;
  width: 100%;
  background: url("peek-image.png") center/cover no-repeat;
  position: relative;
}

/* Scroll indicator */
.scroll-indicator {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.1rem;
  color: white;
  animation: bounce 1.5s infinite;
}

@keyframes bounce {
  0%,100% { transform: translate(-50%, 0); }
  50% { transform: translate(-50%, -10px); }
}

/* ============================
   HORIZONTAL SCROLL SECTION
============================ */
.horizontal-wrapper {
  height: 100vh;
  overflow-x: scroll;
  overflow-y: hidden;
  display: flex;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  background: #f5f5f5;
}

/* Individual project cards */
.project-card {
  min-width: 100vw;
  height: 100vh;
  scroll-snap-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 2rem;
}

.project-card:nth-child(odd) {
  background: white;
}

  background: #e8f5e
